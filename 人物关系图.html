        // 高亮连接
        function highlightConnections(d) {
            const connectedIds = new Set([d.id]);
            
            linksData.forEach(l => {
                if (l.source === d.id) connectedIds.add(l.target);
                if (l.target === d.id) connectedIds.add(l.source);
            });
            
            nodeGroups.style("opacity", n => connectedIds.has(n.id) ? 1 : 0.1);
            
            links
                .classed("highlight", l => l.source === d.id || l.target === d.id)
                .style("opacity", l => {
                    if (l.source === d.id || l.target === d.id) return 1;
                    const sourceNode = nodesData.find(n => n.id === l.source);
                    const targetNode = nodesData.find(n => n.id === l.target);
                    return (activeEras.has(sourceNode?.era) && activeEras.has(targetNode?.era)) ? 0.15 : 0.05;
                });
        }
        
        function resetHighlight() {
            nodeGroups.style("opacity", d => activeEras.has(d.era) ? 1 : 0.1);
            links.classed("highlight", false).style("opacity", d => {
                const sourceNode = nodesData.find(n => n.id === d.source);
                const targetNode = nodesData.find(n => n.id === d.target);
                return (activeEras.has(sourceNode?.era) && activeEras.has(targetNode?.era)) ? 0.6 : 0.05;
            });
        }
        
        // 提示框
        function showTooltip(event, d) {
            const connected = linksData.filter(l => l.source === d.id || l.target === d.id);
            const relations = connected.map(l => {
                const otherId = l.source === d.id ? l.target : l.source;
                const other = nodesData.find(n => n.id === otherId);
                return `• ${other?.name || otherId}: ${l.description || l.type}`;
            }).slice(0, 5);
            
            const tooltip = document.getElementById("tooltip");
            tooltip.innerHTML = `
                <h4>${d.name}</h4>
                <span class="era-badge" style="background: ${d.color}">${d.era}</span>
                <p>${d.description}</p>
                ${relations.length > 0 ? `<p style="color:#ffd700;margin-top:10px;">相关关系:</p>${relations.join('<br>')}` : ''}
                ${d.source ? `<p class="source">📖 来源: ${d.source}</p>` : ''}
            `;
            tooltip.style.display = "block";
            tooltip.style.left = (event.pageX + 15) + "px";
            tooltip.style.top = (event.pageY + 15) + "px";
        }
        
        function hideTooltip() {
            document.getElementById("tooltip").style.display = "none";
        }
        
        // 拖拽
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 模拟更新
        simulation.nodes(nodesData).on("tick", () => {
            links
                .attr("x1", d => d.source.x || d.source)
                .attr("y1", d => d.source.y || d.source)
                .attr("x2", d => d.target.x || d.target)
                .attr("y2", d => d.target.y || d.target);
            
            nodeGroups.attr("transform", d => `translate(${d.x || 0},${d.y || 0})`);
        });
        
        simulation.force("link").links(linksData.map(l => ({
            ...l,
            source: l.source,
            target: l.target
        })));
        
        // 初始化筛选器
        function initFilters() {
            const container = document.getElementById("era-filters");
            const eraCounts = {};
            
            nodesData.forEach(d => {
                eraCounts[d.era] = (eraCounts[d.era] || 0) + 1;
            });
            
            allEras.forEach(era => {
                const color = eraColors[era] || "#999";
                container.innerHTML += `
                    <div class="era-filter">
                        <input type="checkbox" id="era-${era}" checked onchange="toggleEra('${era}')">
                        <span class="era-color" style="background:${color}"></span>
                        <label for="era-${era}">${era}</label>
                        <span class="era-count">${eraCounts[era] || 0}</span>
                    </div>
                `;
            });
        }
        
        function toggleEra(era) {
            if (activeEras.has(era)) {
                activeEras.delete(era);
            } else {
                activeEras.add(era);
            }
            updateVisibility();
        }
        
        // 搜索功能
        document.getElementById("search-btn").addEventListener("click", search);
        document.getElementById("search-input").addEventListener("keypress", e => {
            if (e.key === "Enter") search();
        });
        document.getElementById("reset-btn").addEventListener("click", resetSearch);
        
        function search() {
            const query = document.getElementById("search-input").value.trim().toLowerCase();
            if (!query) return;
            
            const match = nodesData.find(n => n.name.toLowerCase().includes(query));
            if (match) {
                const node = nodeGroups.filter(n => n.id === match.id);
                if (node.empty()) return;
                
                const d = node.datum();
                highlightedNode = d;
                highlightConnections(d);
                
                // 聚焦到该节点
                const transform = d3.zoomTransform(svg.node());
                svg.transition().duration(750).call(
                    zoom.transform,
                    d3.zoomIdentity
                        .translate(width / 2, height / 2)
                        .scale(transform.k)
                        .translate(-(d.x || 0), -(d.y || 0))
                );
                
                // 显示提示
                showTooltip({pageX: width/2, pageY: height/2 - 100}, d);
                setTimeout(hideTooltip, 3000);
            }
        }
        
        function resetSearch() {
            document.getElementById("search-input").value = "";
            highlightedNode = null;
            resetHighlight();
        }
        
        // 初始化图例
        function initLegend() {
            const container = document.getElementById("legend-items");
            allEras.slice(0, 8).forEach(era => {
                const color = eraColors[era] || "#999";
                container.innerHTML += `
                    <div class="legend-item">
                        <span class="legend-color" style="background:${color}"></span>
                        ${era}
                    </div>
                `;
            });
        }
        
        // 窗口大小变化
        window.addEventListener("resize", () => {
            svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
            simulation.force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
            simulation.alpha(0.3).restart();
        });
        
        // 启动
        initFilters();
        initLegend();
        updateVisibility();
    </script>
</body>
</html>
