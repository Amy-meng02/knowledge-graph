<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史年表 - 魏晋南北朝 | 梦梦的知识图谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: #fff;
            z-index: 100;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .back-link:hover { background: rgba(255,255,255,0.2); }
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0a0a0; font-size: 1.1em; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .section { margin-bottom: 50px; }
        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-icon { font-size: 1.2em; }
        .persons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .person-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .person-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        .person-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .person-era { color: #888; font-size: 0.85em; margin-left: 8px; }
        .person-desc {
            color: #ccc;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .person-source { color: #666; font-size: 0.8em; margin-top: 8px; }
        .person-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .tag {
            background: rgba(100,180,255,0.2);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
        }
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .event-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .event-name { font-weight: bold; color: #ff6b6b; font-size: 1.1em; margin-bottom: 8px; }
        .event-desc { color: #ccc; font-size: 0.95em; line-height: 1.5; }
        .event-source { color: #666; font-size: 0.8em; margin-top: 8px; }
        .empty { text-align: center; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <a href="首页.html" class="back-link">← 返回首页</a>
    <div class="header">
        <h1>📜 魏晋南北朝年表</h1>
        <p>历史人物与事件</p>
        <div class="stats">
            <span class="stat-item">👤 3 人物</span>
            <span class="stat-item">📅 0 事件</span>
        </div>
    </div>
    <div class="container">

        <div class="section">
            <h2 class="section-title"><span class="section-icon">👤</span>历史人物</h2>
            <div class="persons-grid">

                <div class="person-card">
                    <div class="person-name">陶渊明<span class="person-era">东晋</span></div>
                    <div class="person-desc">东晋诗人，开创田园诗派。'采菊东篱下，悠然见南山'为其名句</div>
                    <div class="person-source">📚 咬文嚼字二百问</div>
                    <div class="person-tags"><span class="tag">诗人</span><span class="tag">东晋</span><span class="tag">田园诗</span></div>
                </div>

                <div class="person-card">
                    <div class="person-name">阮籍<span class="person-era">魏晋</span></div>
                    <div class="person-desc">魏晋诗人，'竹林七贤'之一</div>
                    <div class="person-source">📚 经典常谈</div>
                    <div class="person-tags"><span class="tag">诗人</span><span class="tag">竹林七贤</span><span class="tag">魏晋</span></div>
                </div>

                <div class="person-card">
                    <div class="person-name">谢灵运<span class="person-era">南朝</span></div>
                    <div class="person-desc">南朝诗人，山水诗派的开创者</div>
                    <div class="person-source">📚 经典常谈</div>
                    <div class="person-tags"><span class="tag">诗人</span><span class="tag">山水诗</span><span class="tag">南朝</span></div>
                </div>
</div></div>
    </div>
</body>
</html>
